<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Traffic monitoring system pipeline</title>
  <desc id="desc">A processing pipeline visual showing video input, YOLO object detection and PostgreSQL storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c1720"/><stop offset="1" stop-color="#17342f"/></linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <text x="58" y="74" fill="#ecfdf5" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Traffic and Crowd Monitoring</text>
  <text x="58" y="106" fill="#86efac" font-family="ui-monospace,monospace" font-size="17">video to insights processing pipeline</text>
  <g fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M283 278H365"/><path d="M540 278H622"/></g>
  <g fill="#34d399"><path d="M365 268l20 10-20 10z"/><path d="M622 268l20 10-20 10z"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="58" y="192" width="225" height="170" rx="18" fill="#142a2c" stroke="#2f5f55"/>
    <rect x="365" y="192" width="175" height="170" rx="18" fill="#174b43" stroke="#34d399"/>
    <rect x="622" y="192" width="220" height="170" rx="18" fill="#142a2c" stroke="#2f5f55"/>
    <text x="82" y="245" fill="#d1fae5" font-size="23" font-weight="700">Video Input</text>
    <text x="82" y="281" fill="#a7f3d0" font-size="16">Traffic and crowd</text><text x="82" y="306" fill="#a7f3d0" font-size="16">camera feeds</text>
    <text x="389" y="245" fill="#d1fae5" font-size="23" font-weight="700">YOLOv8</text>
    <text x="389" y="281" fill="#a7f3d0" font-size="16">Detection and</text><text x="389" y="306" fill="#a7f3d0" font-size="16">tracking</text>
    <text x="647" y="245" fill="#d1fae5" font-size="23" font-weight="700">PostgreSQL</text>
    <text x="647" y="281" fill="#a7f3d0" font-size="16">Stored events and</text><text x="647" y="306" fill="#a7f3d0" font-size="16">monitoring data</text>
  </g>
  <text x="58" y="443" fill="#a7f3d0" font-family="ui-monospace,monospace" font-size="16">Python  •  OpenCV  •  YOLOv8  •  PostgreSQL</text>
</svg>
